<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="with=device-width, initial-scale=1.0">
    <title>Documento</title>
</head>

<body>
    <script>
        document.write("<h3>Exemplo de uso do forEach</h3>");
        let nomes = ["marcos", "Eduardo", "Guilherme"];
        nomes.forEach(nome => {
            document.write("nome: " + nome + "<br>");
        });

        document.write("<h3>Exemplo de uso do map</h3>");
        let numeros = [1, 2, 3];
        let dobro = numeros.map(n => n * 2);
        document.write("Array original: " + numeros + " | map(): " + dobro + "<br>");

        document.write("<h3>Exemplo de uso do filter</h3>");
        numeros = [1, 2, 3, 4, 5, 6];
        let pares = numeros.filter(n => n % 2 === 0);
        document.write("Array original: " + numeros + " | filter(): " + pares + "<br>");

        document.write("<h3>Exemplo de uso do reduce</h3>");
        let precos = [10, 20, 30];
        let total = precos.reduce((acumulador, preco) => {
            return acumulador + preco;
        }, 0);
        document.write("Array preços: " + precos + " | Total: " + total);





    </script>
</body>

</html>
