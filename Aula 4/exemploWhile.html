<!DOCTYPE html>
<html>

<head>
    <meta charset=“UTF-8”>
    <meta name=“viewport” content=“width=device-width, initial-scale=1.0”>
    <title>Document</title>
</head>

<body>
    <script>
        let senha = "54321";
        let leitura = " ";
        while (leitura != senha){
            leitura = prompt("Digite a sua senha:");
        if (leitura == senha)
            alert("Acesso Liberado!");
        else
            alert("Senha Incorreta. Tente novamente!");
        }
    </script>

</body>

</html>
