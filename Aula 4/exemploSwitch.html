<!DOCTYPE html>
<html>

<head>
    <meta charset=“UTF-8”>
    <meta name=“viewport” content=“width=device-width, initial-scale=1.0”>
    <title>Document</title>
</head>

<body>
    <script>
        let dia = prompt("Digite o dia da semana:");
        switch (dia) {
            case "Segunda-feira":
                alert("Início da semana!");
                break;
            case "Quarta-feira":
                alert("Meio da semana!");
                break;
            case "Sexta-feira":
                alert("Fim de semana chegando!");
                break;
            default:
                alert("Dia comum.");
        }
        // Saída: Meio da Semana!
    </script>

</body>

</html>
