<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="with=device-width, initial-scale=1.0">
    <title>Documento</title>
</head>

<body>
    <script>
        // Exemplo de dados de entrada e saída
        // lê o número vizinhos
        var valorConta = Number(prompt("Valor da Conta:"));
        var numeroCliente = Number(prompt("Digite o número de clientes"))
        //Calcula o Valor da Conta para cada cliente
        var valorIndividual = valorConta.toFixed(2) / numeroCliente;
        // apresenta valor individual
        alert ("Valor por Cliente: R$ valorIndividual");

    </script>
</body>

</html>
