<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="with=device-width, initial-scale=1.0">
    <title>Documento</title>
</head>

<body>
    <script>
        // Exemplo de dados de entrada e saída
        // lê o valor da duração de viagem
        var dias = Number(prompt("Dias de Viagem:"));
        var horas = Number(prompt("horas de Viagem:"));
        //Calcula o tempo em horas
        var tempoViagem = dias * 24;
        var totalHoras = tempoViagem + horas;
        // apresenta as respostas
        alert ("Tempo de Viagem " + totalHoras + " horas");

    </script>
</body>

</html>
