<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tabuada</title>
</head>
<body>

<h2>Digite um número de 1 a 10</h2>

<input type="number" id="numero" min="1" max="10">
<button onclick="mostrarTabuada()">Ver Tabuada</button>

<p id="resultado"></p>

<script>
function mostrarTabuada() {
    let num = document.getElementById("numero").value;
    let texto = "";

    for (let i = 1; i <= 10; i++) {
        texto += num + " x " + i + " = " + (num * i) + "<br>";
    }

    document.getElementById("resultado").innerHTML = texto;
}
</script>

</body>
</html>
