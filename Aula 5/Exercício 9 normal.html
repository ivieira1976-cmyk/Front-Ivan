<!DOCTYPE html>
<html>

<head>
    <meta charset=“UTF-8”>
    <meta name=“viewport” content=“width=device-width, initial-scale=1.0”>
    <title>Document</title>
</head>

<body>
    <script>
        function calcularMediaFor() {
    let soma = 0;
    let nota;

    for (let i = 1; i <= 10; i++) {
        nota = parseFloat(prompt("Digite a nota " + i + ":"));
        soma += nota;
    }

    let media = soma / 10;

    document.getElementById("resultadoFor").innerHTML =
        "A média das notas é: " + media.toFixed(2);
    </script>

</body>

</html>
