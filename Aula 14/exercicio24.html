<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site com Chat e Cards</title>
    <style>
        /* Estrutura Base */
        body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; min-height: 100vh; background-color: #f0f2f5; }
        header { background-color: #12192c; color: white; padding: 20px; text-align: center; }
        main { padding: 40px 20px; max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        footer { background-color: #12192c; color: white; text-align: center; padding: 15px; margin-top: auto; }

        /* Grid e Cards */
        .grid-container { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 20px; }
        .card { background-color: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .card:hover { transform: scale(1.05); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-body { padding: 15px; }

        /* Botão de Chat Fixo */
        .chat-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #8a63f7; /* Cor roxa da imagem */
            color: white;
            padding: 15px 30px;
            border-radius: 50px; /* Arredondado */
            border: none;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: background-color 0.3s, transform 0.3s;
            z-index: 1000; /* Garante que fique acima de outros elementos */
        }

        .chat-button:hover {
            background-color: #704ad1; /* Tom de roxo mais escuro no hover */
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <header><h1>Meu Site</h1></header>

    <main>
        <section class="grid-container">
            <!-- Cards -->
            <article class="card"><img src="https://picsum.photos/300/300?random=1"><div class="card-body"><h3>Card 1</h3><p>Conteúdo lateral.</p></div></article>
            <article class="card"><img src="https://picsum.photos/600/300?random=2"><div class="card-body"><h3>Destaque Central</h3><p>Conteúdo com 2 frações.</p></div></article>
            <article class="card"><img src="https://picsum.photos/300/300?random=3"><div class="card-body"><h3>Card 3</h3><p>Conteúdo lateral.</p></div></article>
        </section>
    </main>

    <!-- Botão de Chat -->
    <button class="chat-button">💬 Chat</button>

    <footer><p>Rodapé do site</p></footer>

</body>
</html>
