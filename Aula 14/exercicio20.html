<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estrutura Básica</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #12192c; /* Azul escuro da imagem */
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            flex: 1;
            background-color: #f4f4f4; /* Cinza claro do fundo */
            padding: 40px;
        }

        footer {
            background-color: #12192c;
            color: white;
            text-align: center;
            padding: 15px;
        }

        h1, h2 {
            margin: 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Meu Site</h1>
    </header>

    <main>
        <h2>Conteúdo Principal</h2>
        <p>Área principal da página.</p>
    </main>

    <footer>
        <p>Rodapé do site</p>
    </footer>

</body>
</html>
